name: Deploy daoist to RIVERSOFT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daoist-riversoft-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
          package-manager-cache: false

      - name: Check JavaScript
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build the static game
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install browser test runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run Chromium interaction checks
        run: python tests/browser-smoke.py

      - name: Check the deployment bundle
        run: node tools/riversoft.mjs check ./dist

      - name: Save the verified deployment bundle
        uses: actions/upload-artifact@v7
        with:
          name: daoist-riversoft-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production

    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
          package-manager-cache: false

      - name: Download the verified deployment bundle
        uses: actions/download-artifact@v8
        with:
          name: daoist-riversoft-dist
          path: dist

      - name: Recheck the downloaded bundle
        run: node tools/riversoft.mjs check ./dist

      - name: Publish to RIVERSOFT
        id: publish
        env:
          RIVERSOFT_TOKEN: ${{ secrets.RIVERSOFT_TOKEN }}
        run: |
          set -euo pipefail
          node tools/riversoft.mjs deploy ./dist \
            --slug daoist \
            --title "外卖修仙录" \
            --description "白天送达一份热饭，入夜寻一条自己的仙途。" \
            --kind game \
            --visibility public \
            --yes | tee "$RUNNER_TEMP/riversoft-deploy.json"
          url="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const result = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/riversoft-deploy.json`, "utf8"));
            const url = new URL(result.url || "");
            if (url.protocol !== "https:" || !url.hostname.endsWith(".riversoft.top") || url.pathname !== "/daoist/") {
              throw new Error("RIVERSOFT returned an unexpected public URL.");
            }
            process.stdout.write(url.href);
          ')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          deployment_id="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const result = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/riversoft-deploy.json`, "utf8"));
            if (typeof result.deploymentId !== "string" || !result.deploymentId) throw new Error("RIVERSOFT did not return a deployment ID.");
            process.stdout.write(result.deploymentId);
          ')"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "Published URL: $url"

      - name: Verify the public game or compatibility route
        env:
          PUBLISHED_URL: ${{ steps.publish.outputs.url }}
          DEPLOYMENT_ID: ${{ steps.publish.outputs.deployment_id }}
        run: |
          set -euo pipefail
          expected="$(sha256sum dist/index.html | cut -d ' ' -f1)"
          if curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            "$PUBLISHED_URL" --output "$RUNNER_TEMP/riversoft-public.html"; then
            actual="$(sha256sum "$RUNNER_TEMP/riversoft-public.html" | cut -d ' ' -f1)"
            test "$actual" = "$expected"
            echo "Canonical public page matches the built game: $PUBLISHED_URL"
          else
            echo "::warning::The account subdomain was published, but its DNS/TLS endpoint is not currently valid. Checking the HTTPS compatibility route instead."
            fallback="https://riversoft.top/api/hosting/content/daoist/$DEPLOYMENT_ID/index.html"
            curl --fail --silent --show-error --retry 5 --retry-delay 3 \
              "$fallback" --output "$RUNNER_TEMP/riversoft-compat.html"
            actual="$(sha256sum "$RUNNER_TEMP/riversoft-compat.html" | cut -d ' ' -f1)"
            test "$actual" = "$expected"
            curl --fail --silent --show-error --retry 5 --retry-delay 3 \
              "https://riversoft.top/p/daoist" --output /dev/null
            echo "Published content matches the build through https://riversoft.top/p/daoist"
          fi
