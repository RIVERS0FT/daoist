name: Deploy daoist to RIVERSOFT

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      performance_report_only:
        description: "Explicitly approved release: record frame budget failures without blocking deployment"
        type: boolean
        default: false

permissions:
  contents: read

env:
  DAOIST_ARTIFACT_ROOT: ${{ vars.DAOIST_ARTIFACT_ROOT }}

concurrency:
  group: daoist-riversoft-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'meviu523/daoist' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 55
    environment:
      name: production

    steps:
      - name: Require the persistent artifact host
        run: test "$RUNNER_NAME" = 'VM-0-10-debian'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
          package-manager-cache: false

      - name: Check JavaScript
        run: npm run check

      - name: Run tests
        run: bash scripts/ci-node-tests.sh

      - name: Build the static game
        run: npm run build

      - name: Setup isolated Python tooling
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Install browser test runtime
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/daoist-browser"
          uv pip install --python "$RUNNER_TEMP/daoist-browser/bin/python" playwright pillow
          "$RUNNER_TEMP/daoist-browser/bin/python" -m playwright install chromium
          echo "$RUNNER_TEMP/daoist-browser/bin" >> "$GITHUB_PATH"

      - name: Run Chromium interaction checks
        run: |
          python tests/browser-smoke.py
          python tests/browser-map-seams.py --root dist
          python tests/browser-chapter-regions.py --root dist

      - name: Check frame budgets and module attribution
        env:
          PERFORMANCE_REPORT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.performance_report_only }}
        run: |
          python tests/test_frame_metrics.py
          if [ "$PERFORMANCE_REPORT_ONLY" = 'true' ]; then
            echo '::warning::Frame budget gate waived for this manually approved release; metrics are still recorded.'
            printf '%s\n' 'Frame budget gate waived for this manually approved release; see retained performance report.' >> "$GITHUB_STEP_SUMMARY"
            python tests/browser-performance.py --root dist --report-only
          else
            python tests/browser-performance.py --root dist
          fi

      - name: Check the deployment bundle
        run: node tools/riversoft.mjs check ./dist

      - name: Save the verified deployment bundle
        id: archive
        run: node scripts/runner-artifacts.mjs save daoist-riversoft-dist

      - name: Restore and recheck the saved bundle
        env:
          ARTIFACT_KEY: ${{ steps.archive.outputs.artifact-key }}
        run: |
          node scripts/runner-artifacts.mjs restore "$ARTIFACT_KEY"
          node tools/riversoft.mjs check ./dist

      - name: Publish to RIVERSOFT
        id: publish
        timeout-minutes: 10
        env:
          RIVERSOFT_TOKEN: ${{ secrets.RIVERSOFT_TOKEN }}
        run: |
          set -euo pipefail
          node tools/riversoft.mjs deploy ./dist \
            --slug daoist \
            --title "外卖修仙录" \
            --description "白天送达一份热饭，入夜寻一条自己的仙途。" \
            --kind game \
            --visibility public \
            --yes | tee "$RUNNER_TEMP/riversoft-deploy.json"
          url="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const result = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/riversoft-deploy.json`, "utf8"));
            const url = new URL(result.url || "");
            if (url.protocol !== "https:" || !url.hostname.endsWith(".riversoft.top") || url.pathname !== "/daoist/") {
              throw new Error("RIVERSOFT returned an unexpected public URL.");
            }
            process.stdout.write(url.href);
          ')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          deployment_id="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const result = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/riversoft-deploy.json`, "utf8"));
            if (typeof result.deploymentId !== "string" || !result.deploymentId) throw new Error("RIVERSOFT did not return a deployment ID.");
            process.stdout.write(result.deploymentId);
          ')"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "Published URL: $url"

      - name: Verify every public asset or compatibility route
        env:
          PUBLISHED_URL: ${{ steps.publish.outputs.url }}
          DEPLOYMENT_ID: ${{ steps.publish.outputs.deployment_id }}
        run: |
          node scripts/verify-public.mjs ./dist "$PUBLISHED_URL" "$DEPLOYMENT_ID"

      - name: Retain validation reports on the runner
        if: always()
        run: bash scripts/ci-retain-reports.sh
