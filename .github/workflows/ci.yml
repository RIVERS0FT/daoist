name: Validate pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
          package-manager-cache: false
      - name: Validate source
        run: npm run check
      - name: Run tests
        run: bash scripts/ci-node-tests.sh
      - name: Build static site
        run: npm run build
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install browser test runtime
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Run Chromium interaction checks
        run: |
          python tests/browser-smoke.py
          python tests/browser-map-seams.py --root dist
          python tests/browser-chapter-regions.py --root dist
      - name: Check frame budgets and module attribution
        run: |
          python tests/test_frame_metrics.py
          python tests/browser-performance.py --root dist
      - name: Retain validation reports on the runner
        if: always()
        run: bash scripts/ci-retain-reports.sh
